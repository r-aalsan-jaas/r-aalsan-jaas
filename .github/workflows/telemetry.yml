name: Update Cyber Deck Telemetry

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-telemetry:
    # Use a stable pinned Ubuntu image (e.g., 24.04) instead of 'latest'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        # You are using the latest stable v4, which will continue working.
        uses: actions/checkout@v4

      - name: Set up Python
        # You are using the latest stable v5, which will continue working.
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Telemetry Updater
        run: python update_deck.py

      - name: Commit and Push Updated SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/bottom_deck.svg
          git commit -m "telemetry: update live metrics" || exit 0
          git push
