<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Hazard diagonal stripes pattern -->
    <pattern id="hazard_stripes" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="40" fill="#C8FF00"/>
      <rect x="20" width="20" height="40" fill="#080808"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'Courier New', Courier, monospace; }
    .sans { font-family: 'Impact', 'Arial Black', sans-serif; }
    .neon { fill: #C8FF00; }
    .light { fill: #EAEAEA; }
    .muted { fill: #7E7E7E; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="#080808"/>

  <!-- ==================== [04] JOIN THE RESISTANCE ==================== -->
  <g transform="translate(20, 20)">
    <rect width="365" height="260" fill="#0D0D0D" stroke="#222222" stroke-width="1.2"/>
    <text x="25" y="40" class="mono muted" font-size="13">/04</text>
    <text x="65" y="40" class="mono light" font-size="14" font-weight="900" letter-spacing="1.5">JOIN THE</text>
    <text x="65" y="60" class="mono light" font-size="14" font-weight="900" letter-spacing="1.5">RESISTANCE</text>

    <text x="25" y="105" class="mono muted" font-size="12">Cyber Brutalism is more than a style.</text>
    <text x="25" y="125" class="mono muted" font-size="12">It is a statement. Let us build the</text>
    <text x="25" y="145" class="mono muted" font-size="12">future together.</text>

    <!-- Neon Button -->
    <rect x="25" y="190" width="180" height="42" fill="#C8FF00"/>
    <text x="45" y="216" fill="#000000" class="mono" font-size="12" font-weight="900" letter-spacing="1">LET'S BUILD ↗</text>
  </g>

  <!-- ==================== [05] SYSTEM STATUS ==================== -->
  <g transform="translate(415, 20)">
    <rect width="370" height="260" fill="#0D0D0D" stroke="#222222" stroke-width="1.2"/>
    <text x="25" y="40" class="mono muted" font-size="13">/05</text>
    <text x="65" y="40" class="mono light" font-size="14" font-weight="900" letter-spacing="1.5">SYSTEM STATUS</text>

    <!-- Telemetry Bar 1 -->
    <text x="25" y="85" class="mono muted" font-size="11">CPU_USAGE</text>
    <rect x="105" y="77" width="165" height="8" fill="#1A1A1A"/>
    <rect x="105" y="77" width="120" height="8" fill="#C8FF00"/>
    <text x="345" y="85" class="mono neon" font-size="11" text-anchor="end">73%</text>

    <!-- Telemetry Bar 2 -->
    <text x="25" y="115" class="mono muted" font-size="11">MEMORY</text>
    <line x1="85" y1="112" x2="190" y2="112" stroke="#222222"/>
    <text x="345" y="115" class="mono light" font-size="11" text-anchor="end">12 REPOS // 2 FOLL</text>

    <!-- Telemetry Bar 3 -->
    <text x="25" y="145" class="mono muted" font-size="11">UPTIME</text>
    <line x1="85" y1="142" x2="215" y2="142" stroke="#222222"/>
    <text x="345" y="145" class="mono light" font-size="11" text-anchor="end">18:09:55 UTC</text>

    <!-- Telemetry Bar 4 -->
    <text x="25" y="175" class="mono muted" font-size="11">NETWORK</text>
    <line x1="90" y1="172" x2="270" y2="172" stroke="#222222"/>
    <text x="345" y="175" class="mono neon" font-size="11" text-anchor="end">SECURE</text>

    <!-- Bottom Status Box -->
    <rect x="25" y="200" width="320" height="34" fill="#080808" stroke="#222222" stroke-width="1"/>
    <text x="185" y="222" class="mono neon" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">ALL SYSTEMS OPERATIONAL</text>
  </g>

  <!-- ==================== [06] SUBSCRIBE TO SIGNAL ==================== -->
  <g transform="translate(815, 20)">
    <rect width="365" height="260" fill="#0D0D0D" stroke="#222222" stroke-width="1.2"/>
    <text x="25" y="40" class="mono muted" font-size="13">/06</text>
    <text x="65" y="40" class="mono light" font-size="14" font-weight="900" letter-spacing="1.5">SUBSCRIBE TO SIGNAL</text>

    <text x="25" y="90" class="mono muted" font-size="12">Updates on trends, drops, and</text>
    <text x="25" y="110" class="mono muted" font-size="12">experiments from the lab.</text>

    <!-- Input Box Simulation -->
    <rect x="25" y="145" width="200" height="42" fill="#080808" stroke="#222222"/>
    <text x="40" y="171" class="mono muted" font-size="11">ENTER EMAIL</text>

    <!-- Subscribe Button -->
    <rect x="235" y="145" width="110" height="42" fill="#C8FF00"/>
    <text x="245" y="171" fill="#000000" class="mono" font-size="11" font-weight="900">SUBSCRIBE ↗</text>

    <!-- Hash pattern row -->
    <text x="25" y="225" class="mono muted" font-size="12" letter-spacing="3">//////////////////////////////</text>
  </g>

  <!-- ==================== FOOTER & HAZARD STRIPES ==================== -->
  <line x1="20" y1="310" x2="1180" y2="310" stroke="#1F1F1F" stroke-width="1"/>
  
  <text x="35" y="335" class="mono light" font-size="12" font-weight="800">CYBR_STUDIO © 2026</text>
  <text x="490" y="335" class="mono neon" font-size="12" letter-spacing="2">&gt; ACCESS GRANTED_</text>
  <text x="960" y="335" class="mono muted" font-size="11" letter-spacing="1.5">LON • NY • TYO • BER</text>

  <!-- Bottom Hazard Stripes Bar -->
  <rect x="20" y="355" width="1160" height="35" fill="url(#hazard_stripes)"/>
</svg>
