<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .mono { font-family: 'Courier New', Courier, 'Fira Code', monospace; }
    .neon { fill: #C8FF00; }
    .light { fill: #EAEAEA; }
    .muted { fill: #7E7E7E; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="340" fill="#080808"/>
  <rect x="10" y="10" width="1180" height="320" fill="none" stroke="#1F1F1F" stroke-width="1.5"/>

  <!-- Section Header -->
  <text x="35" y="42" class="mono muted" font-size="14">/03</text>
  <text x="75" y="42" class="mono light" font-size="14" font-weight="900" letter-spacing="2">SELECTED WORK</text>

  <!-- Divider line -->
  <line x1="10" y1="60" x2="1190" y2="60" stroke="#1F1F1F" stroke-width="1"/>

  <!-- ==================== CARD 1: DATA_PORTAL ==================== -->
  <g transform="translate(30, 80)">
    <!-- Outer Card Border -->
    <rect width="270" height="230" fill="#0D0D0D" stroke="#222222" stroke-width="1.2"/>
    <!-- Graphic Box (Neon Dashboard Mockup) -->
    <rect x="15" y="15" width="240" height="130" fill="#0A0A0A" stroke="#1C1C1C"/>
    <!-- Mini UI Mock elements -->
    <rect x="25" y="25" width="60" height="110" fill="#C8FF00" fill-opacity="0.9"/>
    <rect x="95" y="25" width="150" height="8" fill="#252525"/>
    <rect x="95" y="40" width="120" height="8" fill="#1C1C1C"/>
    <line x1="95" y1="60" x2="245" y2="60" stroke="#222222"/>
    <line x1="95" y1="80" x2="245" y2="80" stroke="#222222"/>
    <line x1="95" y1="100" x2="245" y2="100" stroke="#222222"/>

    <!-- Labels -->
    <text x="15" y="172" class="mono light" font-size="12" font-weight="800">DATA_PORTAL</text>
    <text x="15" y="190" class="mono muted" font-size="10">DASHBOARD DESIGN</text>
    <text x="240" y="190" class="mono neon" font-size="16" font-weight="bold">↗</text>
  </g>

  <!-- ==================== CARD 2: NEURAL_NET ==================== -->
  <g transform="translate(320, 80)">
    <!-- Outer Card Border -->
    <rect width="270" height="230" fill="#0D0D0D" stroke="#222222" stroke-width="1.2"/>
    <!-- Graphic Box (Wireframe Tunnel Perspective) -->
    <rect x="15" y="15" width="240" height="130" fill="#0A0A0A" stroke="#1C1C1C"/>
    <!-- Perspective lines -->
    <line x1="15" y1="15" x2="135" y2="80" stroke="#333333"/>
    <line x1="255" y1="15" x2="135" y2="80" stroke="#333333"/>
    <line x1="15" y1="145" x2="135" y2="80" stroke="#333333"/>
    <line x1="255" y1="145" x2="135" y2="80" stroke="#333333"/>
    <polygon points="135,50 165,100 105,100" fill="none" stroke="#C8FF00" stroke-width="1.5"/>

    <!-- Labels -->
    <text x="15" y="172" class="mono light" font-size="12" font-weight="800">NEURAL_NET</text>
    <text x="15" y="190" class="mono muted" font-size="10">AI PLATFORM</text>
    <text x="240" y="190" class="mono neon" font-size="16" font-weight="bold">↗</text>
  </g>

  <!-- ==================== CARD 3: VOID_SYSTEM ==================== -->
  <g transform="translate(610, 80)">
    <!-- Outer Card Border -->
    <rect width="270" height="230" fill="#0D0D0D" stroke="#222222" stroke-width="1.2"/>
    <!-- Graphic Box (Neon Portal Gateway) -->
    <rect x="15" y="15" width="240" height="130" fill="#0A0A0A" stroke="#1C1C1C"/>
    <!-- Glowing Doorway -->
    <rect x="110" y="30" width="50" height="115" fill="#C8FF00" fill-opacity="0.8"/>
    <!-- Silhouette figure -->
    <circle cx="135" cy="80" r="4" fill="#000000"/>
    <rect x="133" y="85" width="4" height="20" fill="#000000"/>

    <!-- Labels -->
    <text x="15" y="172" class="mono light" font-size="12" font-weight="800">VOID_SYSTEM</text>
    <text x="15" y="190" class="mono muted" font-size="10">BRANDING</text>
    <text x="240" y="190" class="mono neon" font-size="16" font-weight="bold">↗</text>
  </g>

  <!-- ==================== CARD 4: GRIDLINE ==================== -->
  <g transform="translate(900, 80)">
    <!-- Outer Card Border -->
    <rect width="270" height="230" fill="#0D0D0D" stroke="#222222" stroke-width="1.2"/>
    <!-- Graphic Box (Planet / Horizon Grid) -->
    <rect x="15" y="15" width="240" height="130" fill="#0A0A0A" stroke="#1C1C1C"/>
    <circle cx="135" cy="80" r="40" fill="none" stroke="#333333" stroke-width="1"/>
    <ellipse cx="135" cy="80" rx="60" ry="16" fill="none" stroke="#C8FF00" stroke-width="1.2"/>
    <text x="75" y="125" class="mono light" font-size="11" font-weight="900" letter-spacing="3">GRIDLINE</text>

    <!-- Labels -->
    <text x="15" y="172" class="mono light" font-size="12" font-weight="800">GRIDLINE</text>
    <text x="15" y="190" class="mono muted" font-size="10">WEB EXPERIENCE</text>
    <text x="240" y="190" class="mono neon" font-size="16" font-weight="bold">↗</text>
  </g>
</svg>
