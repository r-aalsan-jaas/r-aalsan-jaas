<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .mono { font-family: 'Courier New', Courier, 'Fira Code', monospace; }
    .neon { fill: #C8FF00; }
    .light { fill: #EAEAEA; }
    .muted { fill: #7E7E7E; }
  </style>

  <!-- Dark Background -->
  <rect width="1200" height="260" fill="#080808"/>
  <rect x="10" y="10" width="1180" height="240" fill="none" stroke="#1F1F1F" stroke-width="1.5"/>

  <!-- Section Title -->
  <text x="35" y="45" class="mono muted" font-size="14">/02</text>
  <text x="75" y="45" class="mono light" font-size="14" font-weight="900" letter-spacing="2">CORE PRINCIPLES</text>

  <!-- Divider lines -->
  <line x1="10" y1="65" x2="1190" y2="65" stroke="#1F1F1F" stroke-width="1"/>
  <line x1="250" y1="65" x2="250" y2="250" stroke="#181818" stroke-width="1"/>
  <line x1="490" y1="65" x2="490" y2="250" stroke="#181818" stroke-width="1"/>
  <line x1="730" y1="65" x2="730" y2="250" stroke="#181818" stroke-width="1"/>
  <line x1="960" y1="65" x2="960" y2="250" stroke="#181818" stroke-width="1"/>

  <!-- Column 1: FUNCTION OVER FORM -->
  <g transform="translate(35, 85)">
    <!-- Wireframe Isometric Cube Icon -->
    <path d="M 20 5 L 35 13 L 20 21 L 5 13 Z" fill="none" stroke="#C8FF00" stroke-width="1.2"/>
    <path d="M 5 13 L 5 29 L 20 37 L 20 21 Z" fill="none" stroke="#C8FF00" stroke-width="1.2"/>
    <path d="M 35 13 L 35 29 L 20 37 L 20 21 Z" fill="none" stroke="#C8FF00" stroke-width="1.2"/>
    <text x="50" y="18" class="mono neon" font-size="11" font-weight="800">FUNCTION</text>
    <text x="50" y="32" class="mono neon" font-size="11" font-weight="800">OVER FORM</text>
    <text x="0" y="70" class="mono light" font-size="11">Design is built</text>
    <text x="0" y="86" class="mono light" font-size="11">to serve.</text>
    <text x="0" y="106" class="mono muted" font-size="10">Nothing more.</text>
  </g>

  <!-- Column 2: SYSTEMS THINKING -->
  <g transform="translate(275, 85)">
    <!-- Concentric Grid Wireframe Icon -->
    <rect x="5" y="5" width="30" height="30" fill="none" stroke="#C8FF00" stroke-width="1"/>
    <rect x="12" y="12" width="16" height="16" fill="none" stroke="#C8FF00" stroke-width="1"/>
    <line x1="20" y1="0" x2="20" y2="40" stroke="#C8FF00" stroke-width="0.8"/>
    <line x1="0" y1="20" x2="40" y2="20" stroke="#C8FF00" stroke-width="0.8"/>
    <text x="50" y="18" class="mono neon" font-size="11" font-weight="800">SYSTEMS</text>
    <text x="50" y="32" class="mono neon" font-size="11" font-weight="800">THINKING</text>
    <text x="0" y="70" class="mono light" font-size="11">Grids. Modules.</text>
    <text x="0" y="86" class="mono light" font-size="11">Data. Everything</text>
    <text x="0" y="106" class="mono muted" font-size="10">is connected.</text>
  </g>

  <!-- Column 3: DIGITAL AESTHETICS -->
  <g transform="translate(515, 85)">
    <!-- Wave / Scanline Motif Icon -->
    <path d="M 5 10 Q 15 5 20 15 T 35 20" stroke="#C8FF00" stroke-width="1.2" fill="none"/>
    <path d="M 5 20 Q 15 15 20 25 T 35 30" stroke="#C8FF00" stroke-width="1.2" fill="none"/>
    <path d="M 5 30 Q 15 25 20 35 T 35 40" stroke="#C8FF00" stroke-width="1.2" fill="none"/>
    <text x="50" y="18" class="mono neon" font-size="11" font-weight="800">DIGITAL</text>
    <text x="50" y="32" class="mono neon" font-size="11" font-weight="800">AESTHETICS</text>
    <text x="0" y="70" class="mono light" font-size="11">Glitch, noise,</text>
    <text x="0" y="86" class="mono light" font-size="11">scanlines, and</text>
    <text x="0" y="106" class="mono muted" font-size="10">hardware vibes.</text>
  </g>

  <!-- Column 4: BOLD CONTRAST -->
  <g transform="translate(755, 85)">
    <!-- Crosshair / Contrast Grid Icon -->
    <text x="10" y="18" class="mono neon" font-size="16">+</text>
    <text x="25" y="18" class="mono neon" font-size="16">+</text>
    <text x="18" y="32" class="mono neon" font-size="16">+</text>
    <text x="50" y="18" class="mono neon" font-size="11" font-weight="800">BOLD</text>
    <text x="50" y="32" class="mono neon" font-size="11" font-weight="800">CONTRAST</text>
    <text x="0" y="70" class="mono light" font-size="11">High contrast.</text>
    <text x="0" y="86" class="mono light" font-size="11">Harsh colors.</text>
    <text x="0" y="106" class="mono muted" font-size="10">No soft tones.</text>
  </g>

  <!-- Column 5: RAW & AUTHENTIC -->
  <g transform="translate(985, 85)">
    <!-- Pixel / Fragment Cluster Icon -->
    <rect x="10" y="10" width="5" height="5" fill="#C8FF00"/>
    <rect x="17" y="10" width="5" height="5" fill="#C8FF00"/>
    <rect x="24" y="10" width="5" height="5" fill="#C8FF00"/>
    <rect x="17" y="17" width="5" height="5" fill="#C8FF00"/>
    <rect x="17" y="24" width="5" height="5" fill="#C8FF00"/>
    <text x="45" y="18" class="mono neon" font-size="11" font-weight="800">RAW &amp;</text>
    <text x="45" y="32" class="mono neon" font-size="11" font-weight="800">AUTHENTIC</text>
    <text x="0" y="70" class="mono light" font-size="11">No fluff.</text>
    <text x="0" y="86" class="mono light" font-size="11">No polish.</text>
    <text x="0" y="106" class="mono muted" font-size="10">No compromise.</text>
  </g>
</svg>
